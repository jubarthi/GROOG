<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GROOG - Painel de Instrumentos & Criação de Personagens</title>
  
  <!-- Web Manifest & Mobile Settings -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff8c1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Motor e Calculadora Tática GROOG - Painel de Aço & Máquina do Tempo">

  <!-- Google Fonts: Industrial & Nixie Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Core CSS Layers -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/hud-frames.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- STICKY TOP CHRONOMETER BAR -->
  <header class="chrono-header">
    <div class="header-inner">
      
      <!-- LOGO & TOP CONTROLS -->
      <div class="top-brand-row">
        <div class="logo-wrapper">
          <img src="./groog_logo.png" alt="GROOG Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback-text').style.display='block';">
          <div id="logo-fallback-text" class="logo-fallback" style="display: none;">GROOG</div>
        </div>

        <div class="header-quick-actions">
          <button class="btn-chrono" id="btn-toggle-lang" style="padding: 6px 10px; font-size: 0.75rem;">🌐 PT/EN</button>
          <button class="btn-chrono" id="btn-toggle-theme" style="padding: 6px 10px; font-size: 0.75rem;">🎨 TEMA</button>
          <button class="btn-chrono primary" id="btn-save-char" style="padding: 6px 12px; font-size: 0.8rem;">💾 SALVAR</button>
          <button class="btn-chrono" id="btn-manage-profiles" style="padding: 6px 10px; font-size: 0.75rem;">📂 SLOTS</button>
        </div>
      </div>

      <!-- NIXIE COUNTERS GROUP -->
      <div class="nixie-meter-group">
        <div class="meter-unit">
          <span class="meter-label">ORÇAMENTO</span>
          <input type="number" id="inp-campaign-budget" class="budget-edit-input" value="150" title="Pontos da Campanha">
        </div>

        <div class="meter-divider"></div>

        <div class="meter-unit">
          <span class="meter-label">GASTOS</span>
          <span class="meter-value" id="val-points-spent" style="color: var(--brass-light);">105</span>
        </div>

        <div class="meter-divider"></div>

        <div class="meter-unit">
          <span class="meter-label">RESTANTE</span>
          <span class="meter-value" id="val-points-rem">45</span>
        </div>

        <div class="meter-divider"></div>

        <div class="meter-unit">
          <span class="meter-label">TETO DESV.</span>
          <span class="meter-value" id="val-disad-spent" style="font-size: 1.1rem; color: var(--text-dim);">-20/-75</span>
        </div>
      </div>

    </div>
  </header>

  <!-- STEPPER PROGRESS BAR -->
  <div class="stepper-progress-wrap">
    <div class="step-indicator-row">
      <span class="step-title-badge" id="step-title-badge">01. IDENTIFICAÇÃO & ORIGEM</span>
      <span class="step-count-badge" id="step-count-badge">ETAPA 1 DE 8</span>
    </div>
    <div class="step-track">
      <div class="step-bar-fill" id="step-bar-fill" style="width: 12.5%;"></div>
    </div>
  </div>

  <!-- MAIN WIZARD CONTAINER -->
  <main class="wizard-main-container">
    <div id="wizard-step-content">
      <!-- Injetado dinamicamente pelo app.js -->
    </div>
  </main>

  <!-- BOTTOM FIXED ACTION BAR (THUMB ZONE) -->
  <nav class="bottom-action-bar">
    <div class="bottom-action-inner">
      <button class="btn-chrono btn-nav-prev" id="btn-nav-prev" disabled>◀ VOLTAR</button>
      <button class="btn-chrono primary btn-nav-next" id="btn-nav-next">AVANÇAR ▶</button>
    </div>
  </nav>

  <!-- MASTER JAVASCRIPT MODULE -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
